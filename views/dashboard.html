<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixoo64 Dashboard</title>
    <link rel="stylesheet" href="styles/dashboard.css">
    <style>
        .theme-settings { display: none; }
        .theme-settings.active { display: block; }
        #beer-settings .color-picker-group { grid-template-columns: repeat(2, 1fr); }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleDarkMode()">🌓</button>
    
    <div class="container">
        <header class="header">
            <h1>Pixoo64 Control Dashboard</h1>
            <p>Manage your display settings and themes</p>
        </header>

        <section class="theme-selector">
            <div class="theme-card active" data-theme="flags" data-settings="flags-settings">
                <img src="img/theme-thumbnails/flags-thumb.png" alt="Flags & Attendance">
                <h3>Flags & Attendance</h3>
            </div>
            <div class="theme-card" data-theme="beer" data-settings="beer-settings">
                <img src="img/theme-thumbnails/beer-thumb.png" alt="Beer Consumed">
                <h3>Beer Consumed</h3>
            </div>
            <div class="theme-card" data-theme="ai" data-settings="ai-settings">
                <img src="img/theme-thumbnails/ai-thumb.png" alt="AI Chat">
                <h3>AI Chat</h3>
            </div>
        </section>

        <!-- Flags & Attendance Settings (unchanged) -->
        <div id="flags-settings" class="theme-settings active">
            <div class="settings-container">
                <div class="settings-card">
                    <h2>Theme Settings</h2>
                    <div class="form-group">
                        <label for="country-select">Country</label>
                        <select id="country-select">
                            <option value="Australia">Australia</option>
                            <option value="Philippines">Philippines</option>
                            <option value="United States">United States</option>
                            <option value="India">India</option>
                            <option value="Colombia">Colombia</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date & Time Display</label>
                        <label class="switch">
                            <input type="checkbox" id="toggle-date-time">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="settings-card">
                    <h2>Color Settings</h2>
                    <div class="color-picker-group">
                        <div class="form-group">
                            <label>Background</label>
                            <div class="color-picker-container">
                                <div class="color-preview" id="background-preview"></div>
                                <input type="color" id="background-color" class="color-picker-input">
                                <button class="color-picker-button" onclick="document.getElementById('background-color').click()">
                                    Change
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Text</label>
                            <div class="color-picker-container">
                                <div class="color-preview" id="text-preview"></div>
                                <input type="color" id="text-color" class="color-picker-input">
                                <button class="color-picker-button" onclick="document.getElementById('text-color').click()">
                                    Change
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Lines</label>
                            <div class="color-picker-container">
                                <div class="color-preview" id="line-preview"></div>
                                <input type="color" id="line-color" class="color-picker-input">
                                <button class="color-picker-button" onclick="document.getElementById('line-color').click()">
                                    Change
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="settings-card">
                    <h2>KPI Values</h2>
                    <div class="form-group">
                        <label for="green-flags">Green Flags</label>
                        <input type="number" id="green-flags" min="0" step="1">
                    </div>
                    <div class="form-group">
                        <label for="red-flags">Red Flags</label>
                        <input type="number" id="red-flags" min="0" step="1">
                    </div>
                    <div class="form-group">
                        <label for="attendance">Attendance</label>
                        <input type="number" id="attendance" min="0" step="1">
                    </div>
                </div>
            </div>
        </div>

        <!-- Beer Consumed Settings -->
        <div id="beer-settings" class="theme-settings">
            <div class="settings-container">
                <div class="settings-card">
                    <h2>Beer Consumption</h2>
                    <div class="form-group">
                        <label for="beer-location">Location</label>
                        <input type="text" id="beer-location" placeholder="e.g., CRK99">
                    </div>
                    <div class="form-group">
                        <label for="beers-total-available">Total Beers Available</label>
                        <input type="number" id="beers-total-available" min="1" step="1" value="1000">
                    </div>
                    <div class="form-group">
                        <label for="beers-consumed">Beers Consumed</label>
                        <input type="number" id="beers-consumed" min="0" step="1">
                    </div>
                    <div class="form-group">
                        <label for="beers-week">Beers This Week</label>
                        <input type="number" id="beers-week" min="0" step="1">
                    </div>
                    <div class="form-group">
                        <label for="beers-month">Beers This Month</label>
                        <input type="number" id="beers-month" min="0" step="1">
                    </div>
                </div>

                <div class="settings-card">
                    <h2>Display Settings</h2>
                    <div class="color-picker-group">
                        <div class="form-group">
                            <label>Background</label>
                            <div class="color-picker-container">
                                <div class="color-preview" id="beer-bg-preview"></div>
                                <input type="color" id="beer-bg-color" class="color-picker-input">
                                <button class="color-picker-button" onclick="document.getElementById('beer-bg-color').click()">
                                    Change
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Text</label>
                            <div class="color-picker-container">
                                <div class="color-preview" id="beer-text-preview"></div>
                                <input type="color" id="beer-text-color" class="color-picker-input">
                                <button class="color-picker-button" onclick="document.getElementById('beer-text-color').click()">
                                    Change
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Chat Settings -->
        <div id="ai-settings" class="theme-settings">
            <div class="settings-container">
                <div class="settings-card" id="chat-interface">
                    <h2>AI Chat Interface</h2>
                    <div class="currency-selector">
                        <label for="currency-select">Currency: </label>
                        <select id="currency-select">
                            <option value="USD">US Dollar (USD)</option>
                            <option value="AUD">Australian Dollar (AUD)</option>
                            <option value="PHP">Philippine Peso (PHP)</option>
                            <option value="INR">Indian Rupee (INR)</option>
                            <option value="COP">Colombian Peso (COP)</option>
                        </select>
                    </div>
                    <div class="chat-wrapper">
                            <div class="chat-messages" id="chat-messages"></div>
                            <div class="chat-input-area">
                                <input type="text" class="chat-input" id="user-input" placeholder="Type your message...">
                                <button class="send-button" type="button" onclick="sendMessage()">
                                    <span>Send</span>
                                </button>
                            </div>
                            <div class="chat-stats">
                                <div>Messages: <span id="messages-sent">0</span></div>
                                <div>Tokens: <span id="tokens-used">0</span></div>
                                <div>Cost: <span id="total-price">0.00</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        <button id="update-values" onclick="postKPIData()">Update Display</button>
        <div class="status-message"></div>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }

        function initializeDarkMode() {
            if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
        }

        document.querySelectorAll('.theme-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.theme-card, .theme-settings').forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                
                // Hide update button for AI Chat theme
                document.getElementById('update-values').style.display = 
                    this.dataset.theme === 'ai_chat' ? 'none' : 'block';
                    
                // Show the appropriate settings panel
                if (this.dataset.settings) {
                    document.getElementById(this.dataset.settings).classList.add('active');
                }
                
                if (this.dataset.theme !== 'ai_chat') {
                    fetchKPIData();
                }
            });
        });

        async function postKPIData() {
            console.log('postKPIData function triggered'); // Debugging log

            const activeTheme = document.querySelector('.theme-card.active').dataset.theme;
            const currency = document.getElementById('currency-select').value;
            console.log('Updating display with currency:', currency); // Debug log

            const data = {
                theme: activeTheme,
                currency: currency, // Include currency in the data
                background_color: hexToRgb(document.getElementById(
                    activeTheme === 'flags' ? 'background-color' : 'beer-bg-color'
                ).value),
                text_color: hexToRgb(document.getElementById(
                    activeTheme === 'flags' ? 'text-color' : 'beer-text-color'
                ).value)
            };

            console.log('Data being sent to the backend:', data); // Debugging log

            try {
                const response = await fetch('/api/update-kpis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error('Failed to update display');
                console.log('Display updated successfully');
            } catch (error) {
                console.error('Error updating display:', error);
            }
        }

        function rgbToHex(rgb) {
            if (!rgb) return '#000000';
            const parts = rgb.split(',').map(Number);
            return `#${parts.map(p => p.toString(16).padStart(2, '0')).join('')}`;
        }

        function hexToRgb(hex) {
            const normalizedHex = hex.length === 4 ? 
                `#${hex[1]}${hex[1]}${hex[2]}${hex[2]}${hex[3]}${hex[3]}` : hex;
            return [
                parseInt(normalizedHex.substring(1, 3), 16),
                parseInt(normalizedHex.substring(3, 5), 16),
                parseInt(normalizedHex.substring(5, 7), 16),
            ].join(',');
        }

        function updateUI(data) {
            const activeTheme = document.querySelector('.theme-card.active').dataset.theme;
            
            if (activeTheme === 'flags') {
                document.getElementById('green-flags').value = data.green_flags || 0;
                document.getElementById('red-flags').value = data.red_flags || 0;
                document.getElementById('attendance').value = data.attendance || 0;
                document.getElementById('toggle-date-time').checked = data.showDateTime;
                document.getElementById('country-select').value = data.country;
                document.getElementById('background-color').value = rgbToHex(data.background_color);
                document.getElementById('text-color').value = rgbToHex(data.text_color);
                document.getElementById('line-color').value = rgbToHex(data.line_color);
            } else {
                document.getElementById('beer-location').value = data.location || 'Unknown';
                document.getElementById('beers-total-available').value = data.beers_total_available || 1000;
                document.getElementById('beers-consumed').value = data.beers_consumed || 0;
                document.getElementById('beers-week').value = data.beers_week || 0;
                document.getElementById('beers-month').value = data.beers_month || 0;
                document.getElementById('beer-bg-color').value = rgbToHex(data.background_color || '#000000');
                document.getElementById('beer-text-color').value = rgbToHex(data.text_color || '#ffffff');
            }
            initializeColorPreviews();
        }

        function initializeColorPreviews() {
            document.querySelectorAll('.color-picker-input').forEach(input => {
                const previewId = input.id.replace('-color', '-preview');
                const previewBox = document.getElementById(previewId);
                if (previewBox) {
                    previewBox.style.backgroundColor = input.value;
                    input.addEventListener('input', () => previewBox.style.backgroundColor = input.value);
                }
            });
        }

        async function fetchKPIData() {
            try {
                const activeTheme = document.querySelector('.theme-card.active').dataset.theme;
                const currency = document.getElementById('currency-select').value; // Get selected currency
                const response = await fetch(`/api/kpi-data?theme=${activeTheme}&currency=${currency}`);
                const data = await response.json();

                if (activeTheme === 'ai') {
                    messagesSent = data.messages_sent || 0;
                    tokensUsed = data.tokens_used || 0;
                    usdPrice = parseFloat(data.total_price) || 0;

                    // Update the price display with the selected currency
                    document.getElementById('messages-sent').textContent = messagesSent;
                    document.getElementById('tokens-used').textContent = tokensUsed;
                    document.getElementById('total-price').textContent = formatCurrency(usdPrice, currency);
                } else {
                    updateUI(data);
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        let messagesSent = 0;
        let tokensUsed = 0;

        async function sendMessage() {
            console.log('sendMessage function triggered'); // Debugging log

            const userInput = document.getElementById('user-input');
            const message = userInput.value.trim();
            if (!message) {
                console.log('No message to send'); // Debugging log
                return;
            }

            const currency = document.getElementById('currency-select').value;
            console.log('Selected currency:', currency); // Debugging log

            // Append the user's message to the chat interface
            const chatMessages = document.getElementById('chat-messages');
            const userMessageDiv = document.createElement('div');
            userMessageDiv.className = 'chat-message user-message';
            userMessageDiv.textContent = message;
            chatMessages.appendChild(userMessageDiv);

            // Add a loading animation for the AI's response
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'chat-message loading-message';
            loadingDiv.textContent = 'AI is typing...';
            chatMessages.appendChild(loadingDiv);

            // Scroll to the bottom of the chat
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Clear the input box
            userInput.value = '';

            try {
                const response = await fetch('/api/ai-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        currency: currency  // Include currency in the request
                    })
                });

                if (!response.ok) throw new Error('Failed to send message');

                const data = await response.json();
                console.log('Response data:', data); // Debugging log

                // Remove the loading animation
                chatMessages.removeChild(loadingDiv);

                // Append the AI's response to the chat interface
                const aiMessageDiv = document.createElement('div');
                aiMessageDiv.className = 'chat-message ai-message';
                aiMessageDiv.textContent = data.response;
                chatMessages.appendChild(aiMessageDiv);

                // Update the stats
                document.getElementById('messages-sent').textContent = data.messages_sent;
                document.getElementById('tokens-used').textContent = data.tokens_used;
                document.getElementById('total-price').textContent = formatCurrency(data.total_price, data.currency);

                // Scroll to the bottom of the chat
                chatMessages.scrollTop = chatMessages.scrollHeight;

            } catch (error) {
                console.error('Error in sendMessage:', error);

                // Remove the loading animation
                chatMessages.removeChild(loadingDiv);

                // Append an error message to the chat interface
                const errorMessageDiv = document.createElement('div');
                errorMessageDiv.className = 'chat-message error-message';
                errorMessageDiv.textContent = 'Error: Failed to send message.';
                chatMessages.appendChild(errorMessageDiv);
            }
        }

        const exchangeRates = {
            USD: 1.0,
            AUD: 1.50,
            PHP: 56.23,
            INR: 83.33,
            COP: 4165.0
        };

        // Store the original USD price
        let usdPrice = 0;

        // Format currency properly
        function formatCurrency(amount, currency) {
            if (isNaN(amount) || amount === 0) {
                return `${currency} 0.00`;
            }
            
            const rate = exchangeRates[currency] || 1;
            const converted = amount * rate;
            
            // Use symbols where available
            const symbol = {
                'USD': '$',
                'AUD': 'A$',
                'PHP': '₱',
                'INR': '₹',
                'COP': 'COL$'
            }[currency] || currency + ' ';
            
            if (['USD', 'AUD'].includes(currency)) {
                return converted < 0.1 ? 
                    `${symbol}${converted.toFixed(3)}` : 
                    `${symbol}${converted.toFixed(2)}`;
            } else {
                return `${symbol}${Math.round(converted)}`;
            }
        }

        // Update currency display
        function updateCurrencyDisplay() {
            const currency = document.getElementById('currency-select').value;
            document.getElementById('total-price').textContent = formatCurrency(usdPrice, currency);
        }

        // Add event listener for currency changes
        document.getElementById('currency-select').addEventListener('change', updateCurrencyDisplay);

        // Enter key handler
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // Initialize
        initializeDarkMode();
        document.getElementById('update-values').addEventListener('click', postKPIData);
        initializeColorPreviews();
        fetchKPIData();

        // Load initial chat stats
        fetch('/api/kpi-data?theme=ai')
            .then(response => response.json())
            .then(data => {
                messagesSent = data.messages_sent || 0;
                tokensUsed = data.tokens_used || 0;
                usdPrice = parseFloat(data.total_price) || 0;

                document.getElementById('messages-sent').textContent = messagesSent;
                document.getElementById('tokens-used').textContent = tokensUsed;

                usdPrice = parseFloat(data.total_price)

                const currency = data.currency || document.getElementById('currency-select').value;
                document.getElementById('total-price').textContent = formatCurrency(usdPrice, currency);

                updateCurrencyDisplay();
            });

            // Initialize currency selector
            document.getElementById('currency-select').addEventListener('change', function() {
            localStorage.setItem('preferredCurrency', this.value);
            updateCurrencyDisplay();
        });
            // Load saved preference
            const savedCurrency = localStorage.getItem('preferredCurrency') || 'USD';
            document.getElementById('currency-select').value = savedCurrency;

            document.getElementById('currency-select').addEventListener('change', function() {
            localStorage.setItem('preferredCurrency', this.value);
            updateCurrencyDisplay();
            });

            document.addEventListener('DOMContentLoaded', function() {
                const savedCurrency = localStorage.getItem('preferredCurrency') || 'USD';
                document.getElementById('currency-select').value = savedCurrency;
                
                // If we already have a price, update the display
                if (usdPrice > 0) {
                    updateCurrencyDisplay();
                }
            });
    </script>    
</body>
</html>
